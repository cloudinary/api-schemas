  /live_streams/{liveStreamId}/stats:
    parameters:
      - in: path
        name: liveStreamId
        schema:
          type: string
        required: true
        description: The ID of the live stream.
      - in: query
        name: from
        schema:
          type: integer
          format: int64
        description: The start of the time range, as a Unix timestamp in milliseconds. Must be within the last 30 days. Defaults to five minutes before the request.
      - in: query
        name: to
        schema:
          type: integer
          format: int64
        description: The end of the time range, as a Unix timestamp in milliseconds. Defaults to the time of the request.
    get:
      x-speakeasy-mcp:
        name: get-live-stream-stats
        title: Get Live Stream Stats
        readOnlyHint: true
      tags:
        - Live Stream
      summary: Get live stream input stats
      description: Returns the input stats collected for a live stream during a time range, such as the incoming video and audio bitrates, the resolution and codecs declared by the streaming software, and the number of dropped frames. Stats are kept for 30 days. Returns an empty list when no stats were collected in the time range, for example when the stream wasn't receiving input.
      operationId: getLiveStreamStats
      responses:
        '200':
          description: The stats collected during the time range, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStreamStatsWrappedResponse'
              example:
                request_id: 3c1f8e2a9b7d4e6f8a0b1c2d3e4f5a6b
                data:
                  - collected_at: 1763548800000
                    video_bitrate: 4500000
                    video_codec: H264
                    video_width: 1920
                    video_height: 1080
                    video_frame_rate: 30
                    audio_bitrate: 128000
                    bitrate_in_to_out_ratio: 0.98
                    audio_codec: AAC
                    audio_channels: 2
                    audio_sample_rate: 48000
                    client_frames_dropped: 0
        '400':
          description: Bad request. A time value isn't a number, `from` is later than `to`, or the time range is outside the last 30 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
  /live_streams/{liveStreamId}/health:
    parameters:
      - in: path
        name: liveStreamId
        schema:
          type: string
        required: true
        description: The ID of the live stream.
      - in: query
        name: from
        schema:
          type: integer
          format: int64
        description: The start of the time range to assess, as a Unix timestamp in milliseconds. Must be within the last 30 days. Defaults to 15 seconds before the request.
      - in: query
        name: to
        schema:
          type: integer
          format: int64
        description: The end of the time range to assess, as a Unix timestamp in milliseconds. Defaults to the time of the request.
    get:
      x-speakeasy-mcp:
        name: get-live-stream-health
        title: Get Live Stream Health
        readOnlyHint: true
      tags:
        - Live Stream
      summary: Get live stream health
      description: Assesses the health of a live stream's input from the stats collected during a time range. The assessment compares the incoming video and audio bitrates to the bitrates expected for the stream's resolution, frame rate, and codecs, and also takes into account the ratio of incoming to outgoing bitrate and the number of dropped frames. By default, it covers the last 15 seconds, so you can poll it to monitor a stream while it runs.
      operationId: getLiveStreamHealth
      responses:
        '200':
          description: The health assessment for the time range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStreamHealthWrappedResponse'
              example:
                request_id: 8d2e4f6a1b3c5d7e9f0a2b4c6d8e0f1a
                data:
                  assessment: excellent
        '400':
          description: Bad request. A time value isn't a number, `from` is later than `to`, or the time range is outside the last 30 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '404':
          description: Live stream not found
          content:
            application/json:
              schema:
