          type: string
          example: main_stream_archive
          nullable: true
    LiveStreamStatsResponse:
      type: object
      description: The input stats of a live stream at one point in time.
      required:
        - collected_at
        - video_bitrate
        - video_codec
        - video_width
        - video_height
        - video_frame_rate
        - audio_bitrate
        - bitrate_in_to_out_ratio
        - audio_codec
        - audio_channels
        - audio_sample_rate
        - client_frames_dropped
      properties:
        collected_at:
          type: integer
          format: int64
          description: When the stats were collected, as a Unix timestamp in milliseconds.
        video_bitrate:
          type: integer
          description: The measured bitrate of the incoming video, in bits per second.
        video_codec:
          type: string
          description: The video codec declared by the streaming software, for example `H264`.
        video_width:
          type: integer
          description: The video width declared by the streaming software, in pixels.
        video_height:
          type: integer
          description: The video height declared by the streaming software, in pixels.
        video_frame_rate:
          type: integer
          description: The video frame rate declared by the streaming software, in frames per second.
        audio_bitrate:
          type: integer
          description: The measured bitrate of the incoming audio, in bits per second.
        bitrate_in_to_out_ratio:
          type: number
          format: double
          description: The measured ratio of the stream's incoming bitrate to its outgoing bitrate.
        audio_codec:
          type: string
          description: The audio codec declared by the streaming software, for example `AAC`.
        audio_channels:
          type: integer
          description: The number of audio channels declared by the streaming software.
        audio_sample_rate:
          type: integer
          description: The audio sample rate declared by the streaming software, in hertz.
        client_frames_dropped:
          type: integer
          description: A running total of the frames that the streaming software dropped. To see how many frames were dropped between two entries, subtract the earlier value from the later one.
    LiveStreamHealthResponse:
      type: object
      description: The health assessment of a live stream.
      required:
        - assessment
      properties:
        assessment:
          type: string
          description: |
            The health of the stream's input during the time range. One of:
            - `excellent`: the input meets or nearly meets the expected quality.
            - `good`: the input is acceptable but below the expected quality.
            - `poor`: the input is well below the expected quality, or one of the measures is very low.
            - `offline`: there weren't enough stats in the time range to assess the stream, for example because it isn't receiving input.
          example: excellent
    LiveStreamHealthWrappedResponse:
      type: object
      description: A response envelope wrapping a live stream health assessment.
      required:
        - request_id
        - data
      properties:
        request_id:
          type: string
          description: A unique id for the request, useful when contacting support.
          example: 6ec0bd7f11c043da975e2a8ad9ebae0b
        data:
          $ref: '#/components/schemas/LiveStreamHealthResponse'
    LiveStreamAnalyticsMetricsResponse:
      type: object
      description: Viewer metrics for the latest session of a live stream.
      required:
        - current_viewers_count
        - total_viewers_count
        - average_watch_time
      properties:
        current_viewers_count:
          type: integer
          description: The number of unique viewers watching the stream now. Always `0` when the session has ended.
          example: 12
        total_viewers_count:
          type: integer
          description: The number of unique viewers who watched the stream during the session.
          example: 48
        average_watch_time:
          type: integer
          format: int64
          description: The average time that viewers watched the stream during the session, in milliseconds. Views still in progress count up to the time of the request.
          example: 754000
    LiveStreamAnalyticsMetricsWrappedResponse:
      type: object
      description: A response envelope wrapping live stream viewer metrics.
      required:
        - request_id
        - data
      properties:
        request_id:
          type: string
          description: A unique id for the request, useful when contacting support.
          example: 6ec0bd7f11c043da975e2a8ad9ebae0b
        data:
          $ref: '#/components/schemas/LiveStreamAnalyticsMetricsResponse'
    LiveStreamAnalyticsTimeSeriesResponse:
      type: array
      description: The data points of the time series, oldest first.
      items:
        type: object
        description: One data point of the time series.
        required:
          - timestamp
          - value
        properties:
          timestamp:
            type: integer
            format: int64
            description: The time of the data point, as a Unix timestamp in milliseconds.
          value:
            type: integer
            description: The value of the requested metric at that time. For `average_watch_time`, the value is in milliseconds.
    LiveStreamAnalyticsTimeSeriesWrappedResponse:
      type: object
      description: A response envelope wrapping a live stream viewer time series.
      required:
        - request_id
        - data
      properties:
        request_id:
          type: string
          description: A unique id for the request, useful when contacting support.
          example: 6ec0bd7f11c043da975e2a8ad9ebae0b
        data:
          $ref: '#/components/schemas/LiveStreamAnalyticsTimeSeriesResponse'
    LiveStreamStatsWrappedResponse:
