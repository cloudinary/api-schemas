        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
  /live_streams/{liveStreamId}/analytics/metrics:
    parameters:
      - in: path
        name: liveStreamId
        schema:
          type: string
        required: true
        description: The ID of the live stream.
    get:
      x-speakeasy-mcp:
        name: get-live-stream-viewer-metrics
        title: Get Live Stream Viewer Metrics
        readOnlyHint: true
      tags:
        - Live Stream
      summary: Get live stream viewer metrics
      description: |
        Returns viewer metrics for the latest session of a live stream: how many people are watching now, how many watched in total, and the average watch time. A session runs from when the stream is activated until it goes idle.

        Viewer data is reported by the Cloudinary Video Player, which sends an event when a viewer starts and stops watching the stream, unless the player's `cloudinaryAnalytics` option is set to `false`. Viewers who watch the stream in other players aren't counted.
      operationId: getLiveStreamAnalyticsMetrics
      responses:
        '200':
          description: The viewer metrics for the latest session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStreamAnalyticsMetricsWrappedResponse'
              example:
                request_id: 5a7c9e1b3d5f7a9c1e3b5d7f9a1c3e5b
                data:
                  current_viewers_count: 12
                  total_viewers_count: 48
                  average_watch_time: 754000
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '404':
          description: The live stream doesn't exist, or it hasn't had a session yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
  /live_streams/{liveStreamId}/analytics/time_series:
    parameters:
      - in: path
        name: liveStreamId
        schema:
          type: string
        required: true
        description: The ID of the live stream.
      - in: query
        name: from
        schema:
          type: integer
          format: int64
        description: The start of the time range, as a Unix timestamp in milliseconds. Defaults to 15 seconds before the request.
      - in: query
        name: to
        schema:
          type: integer
          format: int64
        description: The end of the time range, as a Unix timestamp in milliseconds. Defaults to the time of the request. If the latest session has ended, the series stops at the end of the session.
      - in: query
        name: dimension
        required: true
        schema:
          type: string
        description: |
          The metric to return. One of:
          - `current_viewers_count`: the number of viewers watching at each point.
          - `total_viewers_count`: the number of viewers who started watching up to each point.
          - `average_watch_time`: the average watch time, in milliseconds, up to each point.
    get:
      x-speakeasy-mcp:
        name: get-live-stream-viewer-time-series
        title: Get Live Stream Viewer Time Series
        readOnlyHint: true
      tags:
        - Live Stream
      summary: Get live stream viewer metrics over time
      description: Returns one viewer metric for the latest session of a live stream as a time series, with a data point every five seconds from `from` to `to`. Use it to chart how the audience changed during the session. Viewer data comes from the Cloudinary Video Player, as described for the viewer metrics endpoint.
      operationId: getLiveStreamAnalyticsTimeSeries
      responses:
        '200':
          description: The time series, oldest point first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStreamAnalyticsTimeSeriesWrappedResponse'
              example:
                request_id: 2b4d6f8a0c2e4a6c8e0b2d4f6a8c0e2d
                data:
                  - timestamp: 1763548800000
                    value: 10
                  - timestamp: 1763548805000
                    value: 12
                  - timestamp: 1763548810000
                    value: 12
        '400':
          description: Bad request. `dimension` is missing or invalid, or a time value isn't a number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '404':
          description: The live stream doesn't exist, or it hasn't had a session yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
