      operationId: updateVideoCanvasApplet
      parameters:
        - name: appletId
          description: The server-generated id of the applet.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: The new applet content.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCanvasAppletContentPayload'
      responses:
        '200':
          description: The updated Video Canvas applet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCanvasAppletDetailsWrappedResponse'
        '400':
          description: The applet content is invalid, for example a missing name, a reference to an unknown block, input, or output, action blocks that can't be compiled into a valid transformation, or an attempt to change the applet's kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '401':
          description: Authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '404':
          description: No applet exists with the given id.
          content:
