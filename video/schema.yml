openapi: 3.0.3
info:
  title: Cloudinary Video API
  description: |
    The Video API enables you to stream, generate, analyze, and transform video in your product environment. Broadcast **live streams** over RTMP, generate videos from images with **Image to Video**, produce timestamped visual transcripts with **AI Video Analysis**, and build node-based transformation pipelines as **Video Canvas** applets.

    The API uses **Basic Authentication** over HTTPS with your **API Key** and **API Secret** from the [Cloudinary Console](https://console.cloudinary.com/app/settings/api-keys), or **OAuth 2.0** with the `video` scope.

    Key capabilities:
    * Create and manage RTMP live streams and their outputs, and start or stop a stream manually. See the [live streaming guide](https://cloudinary.com/documentation/video_live_streaming).
    * Generate a video from a source image and a text prompt describing the motion or scene, and manage reusable prompts. See the [Image to Video add-on](https://cloudinary.com/documentation/image_to_video_addon) guide.
    * Generate a visual transcript of a stored video: timestamped, natural-language descriptions of what's visible on screen, optionally guided by a prompt. See the [AI Video Analysis](https://cloudinary.com/documentation/ai_video_analysis) guide.
    * Create applets that Cloudinary compiles into a [named transformation](https://cloudinary.com/documentation/video_named_transformations) you can deliver like any other transformation. See the [Video Canvas](https://cloudinary.com/documentation/video_canvas) guide.

    Image to Video and AI Video Analysis requests run as asynchronous jobs: you submit a request, then poll the job until the result is ready.

    **Note**: Image to Video and AI Video Analysis are currently in **Beta**. There may be minor changes to parameter names or other implementation details before the general access release. We invite you to try them out, and would appreciate any feedback via our [support team](https://support.cloudinary.com/hc/en-us/requests/new).
  version: 0.1.1 # x-release-please-version
  contact:
    name: Cloudinary Support
    email: support@cloudinary.com
    url: https://support.cloudinary.com
  termsOfService: https://cloudinary.com/tou
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-cld-module-context: cloud
  x-cld-module-name: video
servers:
  - url: https://{region}.cloudinary.com
    description: Regional API endpoints for optimal performance.
    variables:
      region:
        default: api
        description: Regional endpoint selection
        enum:
          - api
          - api-eu
          - api-ap
  - url: https://{host}
    description: Custom domains for enterprise deployments.
    variables:
      host:
        default: api.cloudinary.com
        description: API host domain.
security:
  - basicAuth: []
  - oauth2:
      - video
paths:
  /v2/video/{cloud_name}/video_canvas/applets:
    parameters:
      - $ref: '#/components/parameters/cloud_name'
    get:
      x-speakeasy-mcp:
        name: list-canvas-applets
        title: List Video Canvas Applets
      tags:
        - Video Canvas
      summary: List applets
      description: Returns the account's saved Video Canvas applets as summaries, without their inputs, blocks, connections, or outputs.
      operationId: listVideoCanvasApplets
      parameters:
        - name: kind
          in: query
          required: false
          description: comma-separated applet kinds to return (derived, create); defaults to derived
          schema:
            type: string
            example: derived,create
      responses:
        '200':
          description: A list of Video Canvas applets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCanvasAppletsWrappedResponse'
        '401':
          description: Authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
    post:
      x-speakeasy-mcp:
        name: create-canvas-applet
        title: Create Video Canvas Applet
      tags:
        - Video Canvas
      summary: Create an applet
      description: Creates an applet from its content (inputs, blocks, connections, and outputs). Cloudinary compiles the action blocks to validate them and returns the stored applet. For a derived applet, the compiled blocks are also saved as a named transformation.
      operationId: createVideoCanvasApplet
      x-cld-use-for-readme: true
      requestBody:
        description: The applet content to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCanvasAppletContentPayload'
      responses:
        '201':
          description: The created Video Canvas applet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoCanvasAppletDetailsWrappedResponse'
        '400':
          description: The applet content is invalid, for example a missing name, a reference to an unknown block, input, or output, or action blocks that can't be compiled into a valid transformation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '401':
          description: Authentication error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
