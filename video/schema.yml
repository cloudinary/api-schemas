        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWrappedResponse'
    delete:
      x-speakeasy-mcp:
        name: delete-canvas-applet
        title: Delete Video Canvas Applet
        idempotentHint: true
      tags:
        - Video Canvas
      summary: Delete an applet
      description: Deletes an applet and its stored content. For a derived applet, the named transformation that backs it isn't deleted, so delivery URLs and SDK calls that reference it keep working. To stop delivering the transformation, delete the named transformation separately.
      operationId: deleteVideoCanvasApplet
      parameters:
        - name: appletId
          description: The server-generated id of the applet.
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The applet was deleted.
          content:
